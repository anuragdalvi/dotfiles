# Minimal tmux configuration.
# See the Workspace notes in the Obsidian vault for the full key reference.
#
# Design: keep the standard Ctrl-b prefix so upstream tmux docs and
# tutorials match this environment. Customizations are limited to intuitive
# split keys, vim-direction pane movement, current-directory inheritance,
# clipboard-aware copy mode, mouse support, and a small status line.

# ── Prefix ──
# Ctrl-b is tmux's default; kept as-is intentionally (see design note above).
set -g prefix C-b

# ── Terminal / display ──
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# ── Splits: intuitive characters, inherit current pane's working directory ──
# Ctrl-b v or | -> split left/right (v matches Herdr; | is retained)
# Ctrl-b -  -> split top/bottom
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows also inherit the current directory.
bind c new-window -c "#{pane_current_path}"

# ── Pane focus: vim-direction hjkl ──
# Matches the Neovim <C-h/j/k/l> split-focus keymaps in
# ~/dotfiles/.config/nvim/init.lua, so the same direction keys move focus
# whether the boundary being crossed is a tmux pane or a Neovim split.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize: vim-direction HJKL, repeatable without re-pressing prefix ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ──
# n / p: next/previous window (tmux defaults, kept for clarity).
bind n next-window
bind p previous-window
# 1-9: select window by number (tmux default, unchanged).
# w: window chooser (tmux default, unchanged).

# ── Pane management ──
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind d detach-client
bind q detach-client
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message "tmux config reloaded"

# ── Copy mode: vim keys, clipboard-aware ──
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
# tmux copies to its own buffer and, where supported, the terminal clipboard.
# This avoids hard-coding macOS pbcopy on Ubuntu.
set -s set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Status line: small, unobtrusive ──
set -g status-position bottom
set -g status-style 'fg=colour250'
set -g status-left '#[fg=colour84]#S '
set -g status-right '#[fg=colour250]%H:%M '
set -g status-left-length 30
setw -g window-status-current-style 'fg=colour84,bold'

