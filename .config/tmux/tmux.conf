# Additions to the default tmux bindings.
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind q detach-client
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message "tmux config reloaded"
bind K display-popup -w 80% -h 70% -E 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/sesh/picker.sh"'
bind N display-popup -w 80% -h 40% -d "#{pane_current_path}" -E 'python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/agent-session.py" --prompt'

# Seamless Ctrl-h/j/k/l focus and Alt-h/j/k/l resize across tmux panes and
# Neovim splits. smart-splits.nvim sets @pane-is-vim in panes running Neovim.
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The shell keys taken above stay reachable behind the prefix.
bind C-l send-keys C-l
bind C-k send-keys C-k
bind C-h send-keys C-h
bind C-j send-keys C-j

# Pass modified keys (Ctrl-., Ctrl-Shift-o/i) through to Neovim and OpenCode,
# and advertise true colour support.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys:RGB'

# Forward supported terminal escape sequences and report pane focus changes.
# Graphics capabilities still depend on the terminal running tmux.
set -g allow-passthrough on
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use the terminal clipboard when supported on either platform.
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
