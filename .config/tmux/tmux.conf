# Additions to the default tmux bindings.
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind q detach-client
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message "tmux config reloaded"
bind K display-popup -w 80% -h 70% -E 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/sesh/picker.sh"'
bind N display-popup -w 80% -h 40% -d "#{pane_current_path}" -E 'python3 "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/agent-session.py" --prompt'

# Forward supported terminal escape sequences and report pane focus changes.
# Graphics capabilities still depend on the terminal running tmux.
set -g allow-passthrough on
set -g focus-events on

# Use the terminal clipboard when supported on either platform.
set -s set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
